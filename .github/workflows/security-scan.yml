name: P8-F CI / Security Scan

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend-security:
    name: Backend Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit psycopg
      - name: Bandit scan (Medium+)
        run: bandit -r backend -ll -x backend/env,backend/venv
      - name: Forbidden Artifact and Secret Scan
        run: |
          python backend/scripts/ci_artifact_scan.py

  backend-tests:
    name: Backend Unit and Regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install httpx
      - name: Compileall
        run: python -m compileall backend -q -x ".*(venv|__pycache__).*"
      - name: Run Phase 1-8 unit tests
        env:
          PYTHONPATH: backend
        run: |
          python -m unittest discover -s backend/tests -p "*_test.py" -v
      - name: Run Neon Integration Tests (Optional)
        if: env.REGISTRY_DATABASE_URL != ''
        env:
          PYTHONPATH: backend
          REGISTRY_DATABASE_URL: ${{ secrets.REGISTRY_DATABASE_URL }}
          REGISTRY_DATABASE_ADMIN_URL: ${{ secrets.REGISTRY_DATABASE_ADMIN_URL }}
          NEON_INTEGRATION_TEST: "1"
        run: |
          python -m unittest backend.tests.phase8_registry_concurrency_postgres_integration_test -v
          python -m unittest backend.tests.phase8_registry_workflow_postgres_integration_test -v
          python -m unittest backend.tests.phase8_registry_backup_restore_test -v

  frontend-audit:
    name: Frontend Lint, Build, and Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install deps
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Test
        working-directory: frontend
        run: |
          if [ -f tests/capabilities-fallback.test.mjs ]; then
            node --test tests/*.test.mjs
          fi
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: npm audit (moderate+)
        working-directory: frontend
        run: npm audit --audit-level=moderate
